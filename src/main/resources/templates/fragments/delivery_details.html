<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-3">
        <div class="card p-4">
            <h3>Delivery Request Details</h3>
            <div class="mt-3">
                <p><strong>Order ID:</strong> <span th:text="${details.orderId}"></span></p>
                <p><strong>Company Name:</strong> <span th:text="${details.company.companyName}"></span></p>
                <p><strong>Company Contact:</strong> <span th:text="${details.company.companyPhone}"></span></p>
                <p><strong>Delivery Address:</strong> <span th:text="${details.company.companyAddress}"></span></p>
                <p><strong>Flower Type:</strong> <span th:text="${details.flowerType}"></span></p>
                <p><strong>Quantity (kg):</strong> <span th:text="${details.quantityInKg}"></span></p>
                <p><strong>Delivery Status:</strong> <span th:text="${details.deliveryStatus}"></span></p>
                <p><strong>Expected Delivery By:</strong> <span th:text="${#temporals.format(details.expectedDeliveryBy, 'dd MMM yyyy, HH:mm')}"></span></p>
                <p><strong>Delivered At:</strong> <span th:text="${#temporals.format(details.deliveredAt, 'dd MMM yyyy, HH:mm')}"></span></p>
            </div>
            <div class="mt-4">
                <a href="#" class="btn btn-secondary" data-bs-dismiss="modal">Close</a>
            </div>
        </div>
    </div>

    <!-- JS (Optional for Bootstrap modal functionality) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
