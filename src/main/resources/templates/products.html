<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floral Fusion | Products</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/products_styles.css">
</head>

<body>
    <!-- Header -->
    <header class="bg-light py-3">
        <div class="container">
            <h1 class="h3">Our Products</h1>
        </div>
    </header>

    <!-- Products Section -->
    <section class="products py-4">
        <div class="container">
            <div class="row">
                <!-- Iterate over products -->
                <div class="col-12" th:each="product : ${products}">
                    <div class="product-item d-flex align-items-center p-3 mb-3 border rounded">
                        <!-- Product Image -->
                        <div class="product-img me-3">
                            <img th:src="@{${product.imageUrl}}" alt="Product Image" class="img-fluid" style="width: 100px; height: auto;">
                        </div>
                        <!-- Product Details -->
                        <div>
                            <h5 th:text="${product.name}"></h5>
                            <p th:text="${product.description}"></p>
                            <p><strong>Company:</strong> <span th:text="${product.manufacturer.companyName}"></span></p>
                            <p><strong>Price:</strong> ₹<span th:text="${product.price}"></span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-light py-3">
        <div class="container text-center">
            <p>&copy; 2024 FloralFusion. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>

</html>
