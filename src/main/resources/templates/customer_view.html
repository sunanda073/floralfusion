<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard - Floral Fusion</title>
  <link rel="stylesheet" href="/css/customer_styles.css">
</head>

<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container navbar-content">
      <div class="logo">🌿 Floral Fusion</div>
      <nav>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="/customer/cart">My Cart</a></li>
          <li><a href="/customer/orders">Orders</a></li>
          <li><a href="#">Logout</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <section class="hero">
      <h1>Welcome, <span th:text="${customer.user.fname}">Customer</span>!</h1>
      <p>Explore our range of eco-friendly products made from recycled floral waste.</p>
    </section>

    <!-- Product Filter -->
    <section class="search-section">
      <div class="filter-bar">
        <h2>Explore Products</h2>
        <div class="filter-select">
          <label for="category">Filter by Category:</label>
          <select id="category" onchange="filterProducts()">
            <option value="ALL">All</option>
            <option value="INCENSE_STICKS">Incense Sticks</option>
            <option value="ORGANIC_COMPOST">Organic Compost</option>
            <option value="FLORAL_PAPER">Floral Paper</option>
            <option value="ESSENTIAL_OILS">Essential Oils</option>
            <option value="SOAPS">Soaps</option>
            <option value="CANDLES">Candles</option>
            <option value="DYES">Dyes</option>
            <option value="DECOR_ITEMS">Decor Items</option>
            <option value="HOLI_COLORS">Holi Colors</option>
            <option value="PERFUMES">Perfumes</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Product Grid -->
    <section class="products-section">
      <h2 class="section-heading">Available Products</h2>
      <div class="products-grid">
        <div th:each="product : ${products}" class="product-card" th:data-category="${product.category}">
          <img th:src="@{${product.imageUrl}}" alt="Product Image">
          <div class="product-info">
            <h3 th:text="${product.productName}"></h3>
            <p th:text="${product.description}" class="product-description"></p>
            <p class="price" th:text="${product.price}"></p>

            <!-- New -->
            <form th:action="@{/customer/cart/add}" method="post">
              <input type="hidden" name="productId" th:value="${product.productID}" />
              <button type="submit" class="cart-btn">Add to Cart</button>
            </form>

          </div>
        </div>
      </div>
    </section>


  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Floral Fusion. All rights reserved.</p>
    </div>
  </footer>

  <!-- Script to filter products -->
  <script>
    function filterProducts() {
      const selectedCategory = document.getElementById('category').value;
      const products = document.querySelectorAll('.product-card');

      products.forEach(product => {
        const category = product.getAttribute('data-category');
        product.style.display = (selectedCategory === 'ALL' || category === selectedCategory) ? 'block' : 'none';
      });
    }
  </script>

</body>

</html>
